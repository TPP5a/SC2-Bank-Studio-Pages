name: Publish sealed Studio Pages
run-name: Studio Pages ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable public candidate commit
        required: true
        type: string
      release_id:
        description: Sealed release identifier
        required: true
        type: string
      fence:
        description: Private coordinator fencing number
        required: true
        type: string
      source_revision:
        description: Source revision bound by the sealed manifest
        required: true
        type: string
      manifest_sha256:
        description: Sealed release manifest hash
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'TPP5a/SC2-Bank-Studio-Pages' && github.ref == 'refs/heads/pages-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://tpp5a.github.io/SC2-Bank-Studio-Pages/
    env:
      SC2BS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      SC2BS_RELEASE_ID: ${{ inputs.release_id }}
      SC2BS_FENCE: ${{ inputs.fence }}
      SC2BS_SOURCE_REVISION: ${{ inputs.source_revision }}
      SC2BS_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare reviewed deployment gate outside the site
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sc2bs-pages-gate.cjs" <<'NODE'
          // BEGIN SC2BS PAGES GATE
          const fs = require('node:fs/promises');
          const { createHash } = require('node:crypto');
          const env = process.env, repository = 'TPP5a/SC2-Bank-Studio-Pages';
          const workflowPath = '.github/workflows/publish-pages.yml';
          const check = value => { if (!value) throw new Error('PAGES_GATE_FAILED'); };
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const canonical = value => JSON.stringify(value === null || typeof value !== 'object' ? value : Array.isArray(value) ? value.map(item => JSON.parse(canonical(item))) : Object.fromEntries(Object.keys(value).sort().map(key => [key, JSON.parse(canonical(value[key]))])));
          const exact = (value, keys) => value && typeof value === 'object' && !Array.isArray(value) && canonical(Object.keys(value).sort()) === canonical([...keys].sort());
          const sha40 = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value);
          const sha256 = value => typeof value === 'string' && /^[0-9a-f]{64}$/.test(value);
          const slug = value => typeof value === 'string' && value.length <= 64 && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(value);
          const parse = bytes => JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
          async function api(resource, missing = false) {
            const response = await fetch(`https://api.github.com/repos/${repository}${resource}`, { headers: { Authorization: `Bearer ${env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(30000) });
            if (missing && response.status === 404) return null;
            check(response.ok && !response.redirected); return response.json();
          }
          async function walk(directory, found) {
            for (const name of await fs.readdir(directory)) {
              if (directory === '.' && name === '.git') continue;
              const file = directory === '.' ? name : `${directory}/${name}`, info = await fs.lstat(file);
              check(!info.isSymbolicLink());
              if (info.isDirectory()) { check(found.length <= 1024); await walk(file, found); }
              else { check(info.isFile() && info.nlink === 1 && info.size > 0 && info.size <= 16777216); found.push(file); check(found.length <= 1024); }
            }
          }
          (async () => {
            check(env.GITHUB_REPOSITORY === repository && env.GITHUB_REF === 'refs/heads/pages-staging' && sha40(env.GITHUB_SHA) && env.GITHUB_SHA === env.SC2BS_CANDIDATE_SHA);
            check(slug(env.SC2BS_RELEASE_ID) && sha40(env.SC2BS_SOURCE_REVISION) && sha256(env.SC2BS_MANIFEST_SHA256) && /^[1-9][0-9]*$/.test(env.SC2BS_FENCE) && Number.isSafeInteger(Number(env.SC2BS_FENCE)));
            check(/^[1-9][0-9]*$/.test(env.GITHUB_RUN_ID) && /^[1-9][0-9]*$/.test(env.GITHUB_RUN_ATTEMPT));
            const metadataBytes = await fs.readFile('.sc2bs-release.json'), metadata = parse(metadataBytes);
            check(exact(metadata, ['schemaVersion', 'releaseId', 'correlationId', 'fence', 'sourceRevision', 'manifestSha256', 'baseActive', 'workflowSha256']) && metadata.schemaVersion === 1);
            check(metadata.releaseId === env.SC2BS_RELEASE_ID && metadata.correlationId === metadata.releaseId && metadata.fence === Number(env.SC2BS_FENCE) && metadata.sourceRevision === env.SC2BS_SOURCE_REVISION && metadata.manifestSha256 === env.SC2BS_MANIFEST_SHA256);
            check(metadataBytes.toString('utf8') === canonical(metadata) && metadata.workflowSha256 === hash(await fs.readFile(workflowPath)));
            check(metadata.baseActive === null || exact(metadata.baseActive, ['releaseId', 'fence', 'manifestSha256', 'deploymentIdentity']) && slug(metadata.baseActive.releaseId) && Number.isSafeInteger(metadata.baseActive.fence) && metadata.baseActive.fence > 0 && metadata.baseActive.fence < metadata.fence && sha256(metadata.baseActive.manifestSha256) && sha40(metadata.baseActive.deploymentIdentity));
            const manifestBytes = await fs.readFile('site/release-manifest.json'), manifest = parse(manifestBytes);
            check(hash(manifestBytes) === metadata.manifestSha256 && exact(manifest, ['schemaVersion', 'purpose', 'releaseId', 'sourceRevision', 'files']) && manifest.schemaVersion === 1 && manifest.purpose === 'release' && manifest.releaseId === metadata.releaseId && manifest.sourceRevision === metadata.sourceRevision);
            check(manifestBytes.toString('utf8') === canonical(manifest) && Array.isArray(manifest.files) && manifest.files.length > 0 && manifest.files.length <= 512);
            const expected = ['README.md', workflowPath, '.sc2bs-release.json', 'site/release-manifest.json']; let previous = '', totalBytes = 0;
            for (const file of manifest.files) {
              check(exact(file, ['path', 'byteLength', 'sha256', 'kind']) && typeof file.path === 'string' && file.path > previous && file.path.length <= 240 && /^(?:catalog\.json|index\.html|assets\/[\w.-]+\.(?:js|css|png)|modules\/[a-z0-9-]+\/(?:daily|master)\.json)$/.test(file.path));
              check(Number.isSafeInteger(file.byteLength) && file.byteLength > 0 && file.byteLength <= 16777216 && sha256(file.sha256));
              check(file.kind === (file.path === 'catalog.json' ? 'catalog' : file.path.startsWith('modules/') ? 'encrypted' : 'public'));
              const content = await fs.readFile(`site/${file.path}`); check(content.length === file.byteLength && hash(content) === file.sha256);
              previous = file.path; totalBytes += content.length; expected.push(`site/${file.path}`);
            }
            check(totalBytes <= 134217728 && expected.includes('site/index.html') && expected.includes('site/catalog.json'));
            const found = []; await walk('.', found); check(canonical(found.sort()) === canonical(expected.sort()));
            const head = await api('/git/ref/heads/pages-staging'), tag = await api(`/git/ref/tags/sc2bs-release/${metadata.releaseId}`);
            check(head.object.type === 'commit' && tag.object.type === 'commit' && head.object.sha === env.GITHUB_SHA && tag.object.sha === env.GITHUB_SHA);
            // Even reruns query the provider. An absent/lost response never authorizes a second POST.
            const deployment = await api(`/pages/deployments/${env.GITHUB_SHA}`, true), executions = []; let total;
            for (let page = 1; page <= 10; page++) {
              const result = await api(`/actions/workflows/publish-pages.yml/runs?head_sha=${env.GITHUB_SHA}&event=workflow_dispatch&per_page=100&page=${page}`);
              check(Number.isSafeInteger(result.total_count) && result.total_count >= 1 && result.total_count <= 1000 && Array.isArray(result.workflow_runs));
              if (total === undefined) total = result.total_count; check(total === result.total_count);
              for (const run of result.workflow_runs) {
                check(Number.isSafeInteger(run.id) && run.id > 0 && run.head_sha === env.GITHUB_SHA && run.head_branch === 'pages-staging' && run.path === workflowPath && run.event === 'workflow_dispatch' && Number.isSafeInteger(run.run_attempt) && run.run_attempt >= 1);
                executions.push(run);
              }
              check(executions.length <= total && new Set(executions.map(run => run.id)).size === executions.length);
              if (executions.length === total) break; check(result.workflow_runs.length === 100);
            }
            check(executions.length === total && executions.some(run => run.id === Number(env.GITHUB_RUN_ID)));
            const firstExecution = env.GITHUB_RUN_ATTEMPT === '1' && executions.length === 1 && executions[0].id === Number(env.GITHUB_RUN_ID) && executions[0].run_attempt === 1;
            await fs.appendFile(env.GITHUB_OUTPUT, `deploy=${firstExecution && deployment === null ? 'true' : 'false'}\n`);
          })().catch(() => { console.error('PAGES_GATE_FAILED'); process.exitCode = 1; });
          // END SC2BS PAGES GATE
          NODE
      - name: Validate sealed candidate and first execution
        id: candidate
        run: node "$RUNNER_TEMP/sc2bs-pages-gate.cjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.candidate.outputs.deploy == 'true'
        with:
          path: site/
          retention-days: 1
      - name: Recheck latest staging identity and provider immediately before deployment
        id: final_gate
        if: steps.candidate.outputs.deploy == 'true'
        run: node "$RUNNER_TEMP/sc2bs-pages-gate.cjs"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: steps.final_gate.outputs.deploy == 'true'
        with:
          timeout: 600000
